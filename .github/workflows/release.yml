name: Marka Release Package

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libkeybinder-3.0-dev libayatana-appindicator3-dev rpm libfuse2

      - name: Install Inno Setup (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install innosetup -y

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Packages
        run: flutter pub get

      - name: Build Windows x64 Installer
        if: matrix.os == 'windows-latest'
        run: |
          flutter build windows --release
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /dMyAppArch=x64 windows\runner\marka_installer.iss
          if (Test-Path "windows\runner\Output\*.exe") { copy windows\runner\Output\*.exe Marka-Installer-Windows.exe } elseif (Test-Path "Output\*.exe") { copy Output\*.exe Marka-Installer-Windows.exe } else { copy *.exe Marka-Installer-Windows.exe }

      - name: Build macOS Application Package (DMG & ZIP)
        if: matrix.os == 'macos-latest'
        run: |
          flutter build macos --release
          hdiutil create -volname "Marka" -srcfolder build/macos/Build/Products/Release/Marka.app -ov -format UDZO Marka-Installer-macOS.dmg || true
          cd build/macos/Build/Products/Release/
          zip -r ../../../../Marka-Installer-macOS.zip Marka.app || true

      - name: Build Linux RPM, DEB & AppImage Packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          flutter build linux --release
          chmod +x ./build_linux_packages.sh
          ./build_linux_packages.sh
          cp dist/*.deb Marka-Installer-Ubuntu.deb || true
          cp dist/*.rpm Marka-Installer-Fedora.rpm || true
          cp dist/*.AppImage Marka-Installer-AppImage.AppImage || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-installers
          path: |
            Marka-Installer-*.exe
            Marka-Installer-*.dmg
            Marka-Installer-*.zip
            Marka-Installer-*.deb
            Marka-Installer-*.AppImage
            Marka-Installer-*.rpm

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
